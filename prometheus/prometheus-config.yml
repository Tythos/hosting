global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# rule_files:
#   - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    scrape_timeout: 10s
  
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik_container:8080']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter_container:9100']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'crowdsec'
    static_configs:
      - targets: ['crowdsec_container:6060']
    scrape_interval: 15s
    scrape_timeout: 10s
    # CrowdSec exposes these metric families:
    #   cs_active_decisions     - active bans by reason/action/origin
    #   cs_alerts               - alert counts (excluding CAPI)
    #   cs_reader_queue_length  - log reader queue depth
    #   cs_bucket_capacity      - scenario bucket capacity remaining
    #   go_*                    - Go runtime metrics
